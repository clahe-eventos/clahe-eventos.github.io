<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0c0a07" />
<title>Clahe Eventos · Editor de Invitaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0a07;--panel:#15110a;--panel2:#1d1810;--gold:#cdad24;--gold-soft:#ecd98a;--cream:#efe7d4;--muted:#9a895f;--hair:rgba(205,173,36,.28);--ok:#3a7d44;--ease:cubic-bezier(.22,.61,.25,1)}
*{box-sizing:border-box}
body{margin:0;font-family:'Montserrat',sans-serif;background:var(--bg);color:var(--cream);font-size:14px}
.app{display:grid;grid-template-columns:minmax(360px,460px) 1fr;height:100vh;height:100dvh}
/* ── panel form ── */
.panel{background:var(--panel);border-right:1px solid var(--hair);overflow-y:auto;height:100vh;height:100dvh;-webkit-overflow-scrolling:touch}
.head{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#15110a,#15110aee);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-bottom:1px solid var(--hair);padding:16px 20px}
.head h1{font-family:'Libre Baskerville',serif;font-style:italic;font-size:20px;margin:0;color:var(--gold-soft)}
.head .sub{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-top:3px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{font-family:'Montserrat';font-weight:600;font-size:11px;letter-spacing:1px;text-transform:uppercase;border:1px solid var(--gold);
  background:transparent;color:var(--gold-soft);padding:9px 13px;border-radius:7px;cursor:pointer;transition:.25s var(--ease);
  -webkit-appearance:none;appearance:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn:hover{background:var(--gold);color:#1a1405}
.btn.primary{background:var(--gold);color:#1a1405}
.btn.primary:hover{filter:brightness(1.1)}
.btn.sm{padding:6px 9px;font-size:10px}
.form{padding:8px 20px 60px}
.group{border:1px solid var(--hair);border-radius:10px;margin:14px 0;overflow:hidden;background:var(--panel2)}
.group>summary{cursor:pointer;list-style:none;padding:13px 16px;font-family:'Montserrat';font-weight:600;font-size:12px;
  letter-spacing:1.5px;text-transform:uppercase;color:var(--gold-soft);display:flex;justify-content:space-between;align-items:center}
.group>summary::after{content:"+";color:var(--gold);font-size:16px}
.group[open]>summary::after{content:"–"}
.group>summary::-webkit-details-marker{display:none}
.gbody{padding:6px 16px 16px}
.field{margin:11px 0}
.field label{display:block;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.field input[type=text],.field input[type=date],.field input[type=time],.field input[type=number],.field input[type=url],.field textarea,.field select{
  width:100%;background:#0d0b07;border:1px solid var(--hair);border-radius:7px;color:var(--cream);
  font-family:'Montserrat';font-size:13px;padding:9px 11px;outline:none;transition:.2s}
.field input:focus,.field textarea:focus{border-color:var(--gold)}
.field textarea{min-height:66px;resize:vertical;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:12.5px;color:var(--cream)}
.chk input{width:17px;height:17px;accent-color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .chk{width:calc(50% - 5px);margin:0;text-transform:none;letter-spacing:0}
/* itinerario */
.itrow{display:grid;grid-template-columns:84px 1fr 34px;gap:8px;margin:8px 0;align-items:center}
.itrow input{margin:0}
.del{border:1px solid var(--hair);background:transparent;color:#c98;border-radius:7px;height:36px;cursor:pointer;font-size:16px}
.del:hover{background:#3a1414;color:#fdd}
.hint{font-size:11px;color:var(--muted);line-height:1.5;margin:4px 0 0}
.hint b{color:var(--gold-soft)}
/* preview */
.preview{position:relative;background:#000;height:100vh;height:100dvh}
.pvbar{position:absolute;top:0;left:0;right:0;height:42px;background:#0c0a07;border-bottom:1px solid var(--hair);display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:3}
.pvbar .t{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.devices{display:flex;gap:6px}
.dev{border:1px solid var(--hair);background:transparent;color:var(--gold-soft);border-radius:6px;padding:5px 10px;font-size:10px;cursor:pointer;text-transform:uppercase;letter-spacing:1px}
.dev.on{background:var(--gold);color:#1a1405}
.frameWrap{position:absolute;top:42px;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:18px}
#pv{border:0;background:#000;width:100%;height:100%;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#pv.phone{width:390px;height:96%;flex:0 0 auto;border:1px solid var(--hair)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--gold);color:#1a1405;
  padding:11px 20px;border-radius:8px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:.35s var(--ease);z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ── campo de imagen (subir foto) ── */
.imgbox{display:flex;gap:10px;align-items:flex-start;margin-top:6px}
.imgbox .thumb{width:64px;height:64px;flex:0 0 auto;border-radius:8px;border:1px solid var(--hair);object-fit:cover;background:#0d0b07;display:none}
.imgbox .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.imgbox .btnrow{display:flex;gap:7px;flex-wrap:wrap}
.imgbox input[type=text]{width:100%}
.busy{opacity:.55;pointer-events:none}
/* ── celular / iPhone ── */
@media(max-width:880px){
  body{overflow-x:clip}
  .app{display:flex;flex-direction:column;height:auto}
  .preview{order:-1;position:sticky;top:0;z-index:20;height:56vh;height:56dvh;border-bottom:1px solid var(--hair)}
  .panel{order:1;height:auto;overflow:visible;border-right:0}
  .head{position:static;padding-left:calc(20px + env(safe-area-inset-left));padding-right:calc(20px + env(safe-area-inset-right))}
  .form{padding-left:calc(20px + env(safe-area-inset-left));padding-right:calc(20px + env(safe-area-inset-right));padding-bottom:calc(70px + env(safe-area-inset-bottom))}
  .frameWrap{padding:8px}
  #pv.phone{width:100%;height:100%}
  .chips .chk{width:100%}
  .field input[type=text],.field input[type=date],.field input[type=time],.field input[type=number],.field input[type=url],.field textarea,.field select{font-size:16px}
  .btn{padding:11px 14px}
  .itrow{grid-template-columns:76px 1fr 38px}
}
/* ── buscador de campos ── */
.search{width:100%;margin-top:10px;background:#0d0b07;border:1px solid var(--hair);border-radius:7px;color:var(--cream);
  font-family:'Montserrat';font-size:13px;padding:9px 11px;outline:none;-webkit-appearance:none;appearance:none}
.search:focus{border-color:var(--gold)}
.search::-webkit-search-cancel-button{filter:invert(.7) sepia(1) saturate(3) hue-rotate(5deg)}
.nores{color:var(--muted);font-size:12px;padding:14px 4px;display:none}
/* ── paleta de color ── */
.temas{display:flex;flex-wrap:wrap;gap:9px}
.tema{width:calc(33.333% - 6px);border:1px solid var(--hair);background:transparent;border-radius:9px;padding:7px 8px 8px;
  cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center;color:var(--muted);
  font-family:'Montserrat';font-size:10px;letter-spacing:.3px;transition:.2s var(--ease);-webkit-appearance:none;appearance:none}
.tema .sw{width:100%;height:24px;border-radius:5px;border:1px solid rgba(255,255,255,.14)}
.tema.on{border-color:var(--gold);color:var(--gold-soft);background:rgba(205,173,36,.07)}
/* ── estado de un campo (ej. whatsapp) ── */
.est{font-size:11px;margin:5px 0 0;line-height:1.45}
.est.ok{color:#8fbf7a}
.est.warn{color:#d9b45a}
.est a{color:var(--gold-soft)}
/* ── boton flotante de descarga (celular) ── */
.fab{display:none;position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:40;
  border:0;border-radius:999px;background:var(--gold);color:#1a1405;font-family:'Montserrat';font-weight:700;
  font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:14px 20px;box-shadow:0 10px 26px rgba(0,0,0,.5);
  cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation}
@media(max-width:880px){
  .fab{display:block}
  .tema{width:calc(50% - 5px)}
}
/* ── publicar con un link (ventana) ── */
.pubwrap{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.pubwrap[hidden]{display:none}
.pub{width:100%;max-width:460px;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto;background:var(--panel2);
  border:1px solid var(--hair);border-radius:14px;padding:20px 20px 16px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.pub h2{font-family:'Libre Baskerville',serif;font-style:italic;font-weight:400;font-size:20px;margin:0 0 6px;color:var(--gold-soft)}
.pub p{font-size:13px;line-height:1.55;margin:8px 0}
.pub ol{margin:6px 0 10px;padding-left:20px;font-size:12.5px;line-height:1.6}
.pub a{color:var(--gold-soft)}
.pub .field{margin:12px 0 8px}
.pub .field input{width:100%;background:#0d0b07;border:1px solid var(--hair);border-radius:7px;color:var(--cream);font-family:'Montserrat';font-size:16px;padding:10px 11px;outline:none}
.pub .field input:focus{border-color:var(--gold)}
.pub .linkbox{display:flex;gap:8px;margin:12px 0 4px}
.pub .linkbox input{flex:1;min-width:0;background:#0d0b07;border:1px solid var(--hair);border-radius:7px;color:var(--gold-soft);font-family:'Montserrat';font-size:13px;padding:10px 11px;outline:none}
.pub .rowb{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.pub a.btn{display:inline-block;text-decoration:none}
.pub .btn.wa{background:#25d366;border-color:#25d366;color:#08331a}
.pub .btn.wa:hover{filter:brightness(1.08)}
.pub .prog{display:flex;align-items:center;gap:10px;margin:14px 0;font-size:13px;line-height:1.5}
.spin{width:18px;height:18px;flex:0 0 auto;border:2px solid var(--hair);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pub .err{color:#f0a6a6}
.pub .list{margin-top:14px;border-top:1px solid var(--hair);padding-top:10px}
.pub .lt{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.pub .it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:12px}
.pub .it a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none}
@media(max-width:880px){
  .pubwrap{align-items:flex-end;padding:0}
  .pub{max-width:none;border-radius:16px 16px 0 0;max-height:88vh;max-height:88dvh;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div class="app">
  <div class="panel">
    <div class="head">
      <h1>Editor de Invitaciones</h1>
      <div class="sub">Clahe Eventos · Panel</div>
      <div class="actions">
        <button class="btn primary" id="publish">🔗 Publicar (link)</button>
        <button class="btn" id="download">⬇ Descargar</button>
        <button class="btn" id="saveJson">Guardar datos</button>
        <button class="btn" id="loadJson">Cargar datos</button>
        <button class="btn" id="reset">Reiniciar</button>
        <input type="file" id="fileJson" accept="application/json" hidden>
      </div>
      <input type="search" id="buscar" class="search" placeholder="Buscar un campo (fecha, salón, regalo...)" autocomplete="off">
    </div>
    <div class="form" id="form"></div>
    <p class="nores" id="nores">No hay ningún campo con ese nombre.</p>
  </div>
  <div class="preview">
    <div class="pvbar">
      <span class="t">Vista previa en vivo</span>
      <div class="devices">
        <button class="dev on" data-d="desktop">Escritorio</button>
        <button class="dev" data-d="phone">Celular</button>
        <button class="dev" id="openTab">Abrir ↗</button>
      </div>
    </div>
    <div class="frameWrap"><iframe id="pv"></iframe></div>
  </div>
</div>
<button class="fab" id="fab">🔗 Publicar</button>
<div class="pubwrap" id="pub" hidden><div class="pub" id="pubCard" role="dialog" aria-modal="true" aria-labelledby="pubTitle"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ════════ Plantilla real de Clahe (inyectada) ════════ */

const formEl=document.getElementById('form');
function buildForm(){
  formEl.innerHTML='';
  SCHEMA.forEach((grp,gi)=>{
    const d=document.createElement('details');d.className='group';if(gi<3)d.open=true;
    const sm=document.createElement('summary');sm.textContent=grp[0];d.appendChild(sm);
    const body=document.createElement('div');body.className='gbody';
    grp[1].forEach(fld=>body.appendChild(renderField(fld)));
    d.appendChild(body);formEl.appendChild(d);
  });
}
function renderField(campo){
  const [path,label,type,extra]=campo;
  const wrap=document.createElement('div');
  if(type==='itinerary')return renderItinerary();
  if(type==='show')return renderShow();
  if(type==='theme')return renderTheme();
  if(type==='image')return renderImage(path,label);
  if(type==='select')return renderSelect(path,label,extra);
  if(type==='tel')return renderTel(path,label);
  wrap.className='field';
  wrap.dataset.busca=normal(label);
  if(path==='__date'||path==='__start'){
    wrap.innerHTML='<label>'+label+'</label>';
    const inp=document.createElement('input');inp.type=(path==='__date'?'date':'time');
    if(path==='__date'){const z=n=>String(n).padStart(2,'0');inp.value=state.date.y+'-'+z(state.date.mo)+'-'+z(state.date.d);}
    else inp.value=String(state.date.h).padStart(2,'0')+':'+String(state.date.mi).padStart(2,'0');
    inp.oninput=()=>{ if(path==='__date'){const[y,m,da]=inp.value.split('-').map(Number);if(y){state.date.y=y;state.date.mo=m;state.date.d=da;state.date.dayNum=String(da);state.date.month=MESES[m-1];state.date.year=String(y);state.date.dayName=DIAS[new Date(y,m-1,da).getDay()];refreshDateText();}}
      else{const[h,mi]=inp.value.split(':').map(Number);state.date.h=h;state.date.mi=mi;refreshDateText();} schedule(); };
    wrap.appendChild(inp);return wrap;
  }
  wrap.innerHTML='<label>'+label+'</label>';
  const el=type==='textarea'?document.createElement('textarea'):document.createElement('input');
  if(type!=='textarea')el.type=(type==='number'?'number':type==='url'?'url':'text');
  el.value=get(state,path)??'';
  el.dataset.path=path;
  el.oninput=()=>{
    set(state,path, type==='number'?Number(el.value):el.value);
    if(path==='date.durationHours')refreshDateText();
    schedule();
  };
  wrap.appendChild(el);return wrap;
}

/* ── foto desde el celular (o URL) ──────────────────────────────
   Achicamos la imagen en el navegador para que la invitacion no
   pese de mas: maximo 1400px de lado y JPEG de calidad .82.      */
const MAX_SIDE=1400, JPEG_Q=.82;
async function decodeImage(file){
  try{ return await createImageBitmap(file,{imageOrientation:'from-image'}); }
  catch(e){}
  try{ return await createImageBitmap(file); }
  catch(e){}
  return await new Promise((res,rej)=>{
    const u=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{URL.revokeObjectURL(u);res(im);};
    im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('decode'));};
    im.src=u;
  });
}
async function fileToDataUrl(file){
  const img=await decodeImage(file);
  const w0=img.width||img.naturalWidth, h0=img.height||img.naturalHeight;
  if(!w0||!h0) throw new Error('vacia');
  const k=Math.min(1, MAX_SIDE/Math.max(w0,h0));
  const c=document.createElement('canvas');
  c.width=Math.round(w0*k); c.height=Math.round(h0*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  if(img.close)img.close();
  return c.toDataURL('image/jpeg',JPEG_Q);
}
const kbOf=d=>Math.round(d.length/1365);
function renderImage(path,label){
  const wrap=document.createElement('div');wrap.className='field';
  wrap.dataset.busca=normal(label+' foto imagen');
  wrap.innerHTML='<label>'+label+'</label>';
  const box=document.createElement('div');box.className='imgbox';
  const thumb=document.createElement('img');thumb.className='thumb';thumb.alt='';
  const col=document.createElement('div');col.className='col';
  const row=document.createElement('div');row.className='btnrow';
  const file=document.createElement('input');file.type='file';file.accept='image/*';file.hidden=true;
  const pick=document.createElement('button');pick.type='button';pick.className='btn sm';pick.textContent='Subir foto';
  const clr =document.createElement('button');clr.type='button';clr.className='btn sm';clr.textContent='Quitar';
  const url=document.createElement('input');url.type='text';url.placeholder='...o pega el enlace de una imagen';
  const hint=document.createElement('p');hint.className='hint';

  function sync(){
    const v=get(state,path)||'', isData=v.slice(0,5)==='data:';
    if(v){thumb.src=v;thumb.style.display='block';}else{thumb.removeAttribute('src');thumb.style.display='none';}
    url.value=isData?'':v;
    clr.style.display=v?'':'none';
    hint.innerHTML = isData
      ? ('Foto cargada desde el dispositivo &middot; <b>~'+kbOf(v)+' KB</b>. Viaja dentro del archivo de la invitacion.')
      : 'Pod&eacute;s subir una foto del celular o pegar un enlace.';
  }
  pick.onclick=()=>file.click();
  file.onchange=async()=>{
    const f=file.files&&file.files[0]; file.value='';
    if(!f)return;
    wrap.classList.add('busy'); toast('Procesando la foto...');
    try{
      const data=await fileToDataUrl(f);
      set(state,path,data); sync(); schedule();
      toast('Foto lista ('+kbOf(data)+' KB) ✓');
    }catch(e){
      toast('No pudimos leer esa imagen. Probá con otra.');
    }finally{ wrap.classList.remove('busy'); }
  };
  clr.onclick=()=>{ set(state,path,''); sync(); schedule(); };
  url.oninput=()=>{
    const v=url.value.trim(); set(state,path,v);
    if(v){thumb.src=v;thumb.style.display='block';}else{thumb.style.display='none';}
    clr.style.display=v?'':'none'; schedule();
  };

  row.append(pick,clr);
  col.append(row,url,hint);
  box.append(thumb,col);
  wrap.append(box,file);
  sync();
  return wrap;
}

/* Arma "22:00 a 05:00 hs" con la hora de inicio y la duración. Solo lo pisa
   si el texto sigue siendo el que generamos antes: si lo escribiste a mano,
   se respeta. */
function autoHorario(d){
  const z=n=>String(n).padStart(2,'0');
  const fin=new Date(2000,0,1,Number(d.h)||0,Number(d.mi)||0);
  fin.setMinutes(fin.getMinutes()+Math.round((Number(d.durationHours)||0)*60));
  return z(Number(d.h)||0)+':'+z(Number(d.mi)||0)+' a '+z(fin.getHours())+':'+z(fin.getMinutes())+' hs';
}
let horarioPrevio=autoHorario(state.date);
function refreshDateText(){
  if(state.date.time && state.date.time!==horarioPrevio)return;
  horarioPrevio=autoHorario(state.date);
  state.date.time=horarioPrevio;
  const campo=formEl.querySelector('[data-path="date.time"]');
  if(campo)campo.value=horarioPrevio;
}

/* ── construir HTML final ── */
const escHtml=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
/* <title> y las etiquetas og: son lo que WhatsApp muestra en la vista previa
   del link. El JS de la invitación cambia el título al abrirse, pero WhatsApp
   no ejecuta JS: por eso van escritas en el HTML fijo. */
function metaSocial(html,opts){
  const d=state.date||{}, v=state.venue||{};
  const titulo=[state.preTitle,state.eventLabel].filter(Boolean).join(' ')+(state.celebrant?' · '+state.celebrant:'');
  const cuando=(d.dayName&&d.dayNum&&d.month)?(d.dayName+' '+d.dayNum+' de '+d.month+(d.year?' de '+d.year:'')):'';
  const desc=[cuando,v.name].filter(Boolean).join(' · ')||(state.brand&&state.brand.tagline)||'';
  html=html.replace(/<title>[^<]*<\/title>/,()=>'<title>'+escHtml(titulo)+'</title>')
           .replace(/<meta property="og:title" content="[^"]*"\s*\/?>/,()=>'<meta property="og:title" content="'+escHtml(titulo)+'" />')
           .replace(/<meta property="og:description" content="[^"]*"\s*\/?>/,()=>'<meta property="og:description" content="'+escHtml(desc)+'" />');
  let extra='';
  if(opts.url)extra+='<meta property="og:url" content="'+escHtml(opts.url)+'" />\n';
  if(/^https?:\/\//i.test(state.photoUrl||''))extra+='<meta property="og:image" content="'+escHtml(state.photoUrl)+'" />\n';
  if(opts.pubId)extra+='<meta name="clahe-pub" content="'+escHtml(opts.pubId)+'" />\n';
  return extra?html.replace('</head>',()=>extra+'</head>'):html;
}
function buildHTML(preview,opts){
  const i=TEMPLATE.indexOf('const CONFIG');
  const j=TEMPLATE.indexOf('\n};', i)+3;
  /* Si un texto trae "</" seguido de "script", el navegador cortaria ahi el
     script de la invitación y el resto dejaria de funcionar. Escapando la
     barra queda "<\/", que en JS vale igual y el parser HTML ya no lo ve. */
  const datos=JSON.stringify(state,null,2).replace(/<\//g,'<\/');
  let html=TEMPLATE.slice(0,i)+'const CONFIG = '+datos+';'+TEMPLATE.slice(j);
  html=metaSocial(html,opts||{});
  if(preview)html=html.replace('</head>','<style>#intro{display:none!important}</style></head>');
  return html;
}

function dl(name,content,type){
  const b=new Blob([content],{type});const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download=name;a.rel='noopener';
  document.body.appendChild(a);a.click();a.remove();           // Safari necesita el <a> en el DOM
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}
/* En iPhone el menu nativo de compartir es mas util que "descargar":
   permite mandarlo por WhatsApp o guardarlo en Archivos. */
async function saveFile(name,content,type){
  if(IS_IOS && navigator.canShare){
    try{
      const f=new File([content],name,{type});
      if(navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:name}); return true; }
    }catch(e){ if(e && e.name==='AbortError') return false; }
  }
  dl(name,content,type); return true;
}
function slug(s){return String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');}

/* ── buscador de campos ──────────────────────────────────────────────
   El formulario tiene mas de 40 campos repartidos en 9 bloques; escribir
   "salon" o "regalo" es mas rapido que abrirlos uno por uno. */
const buscarEl=document.getElementById('buscar'), noresEl=document.getElementById('nores');
function aplicarBusqueda(){
  const q=normal(buscarEl.value.trim());
  const grupos=[...formEl.querySelectorAll('.group')];
  if(!q){
    grupos.forEach((g,i)=>{g.hidden=false;g.open=i<3;g.querySelectorAll('.field').forEach(f=>f.hidden=false);});
    noresEl.style.display='none';return;
  }
  let encontrados=0;
  grupos.forEach(g=>{
    const titulo=normal(g.querySelector('summary').textContent);
    const campos=[...g.querySelectorAll('.field')];
    let visibles=0;
    campos.forEach(f=>{
      const hit=titulo.includes(q)||normal(f.dataset.busca||f.textContent).includes(q);
      f.hidden=!hit; if(hit)visibles++;
    });
    /* los bloques sin campos sueltos (cronograma, estilo, secciones) se buscan por titulo */
    const porTitulo=campos.length===0&&titulo.includes(q);
    g.hidden=!(visibles||porTitulo);
    g.open=!g.hidden;
    encontrados+=visibles+(porTitulo?1:0);
  });
  noresEl.style.display=encontrados?'none':'block';
}
buscarEl.oninput=aplicarBusqueda;

/* ── publicar con un link ────────────────────────────────────────────
   Un .html descargado no se abre bien en iPhone: Archivos lo muestra sin
   JavaScript y la invitación queda clavada en la intro. Un link sí abre.
   "Publicar" sube la invitación a este mismo repositorio con la API de
   GitHub y GitHub Pages la sirve en  <base>/i/<nombre>/ . Hace falta una
   clave (token) de GitHub con permiso de escritura solo sobre este repo;
   queda guardada en el dispositivo y se pide una sola vez. */
/* Dónde vive el sitio. No hay nada fijo: se deduce de la dirección desde la
   que se abrió el editor, así el repositorio puede cambiar de dueño o de
   nombre sin tocar el código:
     <usuario>.github.io/<repo>/admin.html  →  usuario + repo
     <usuario>.github.io/admin.html         →  usuario + repo "<usuario>.github.io"
   Si algún día el sitio usa dominio propio (p. ej. invitaciones.claheeventos.com),
   completar PUB_FIJO con el dueño y el nombre del repositorio. */
const PUB_FIJO={owner:'',repo:''};
function detectarRepo(hostname,pathname){
  const m=String(hostname||'').match(/^([^.]+)\.github\.io$/i);
  if(!m)return null;
  const seg=String(pathname||'').split('/').filter(Boolean);
  const carpeta=(seg.length&&!/\.\w+$/.test(seg[0]))?seg[0]:'';
  return {owner:m[1],repo:carpeta||(m[1]+'.github.io')};
}
const PUB=Object.assign({branch:'main',dir:'i',base:location.origin+location.pathname.replace(/[^/]*$/,'')},
  PUB_FIJO.owner?PUB_FIJO:(detectarRepo(location.hostname,location.pathname)||{owner:'',repo:''}));
const pubEl=document.getElementById('pub'), pubCard=document.getElementById('pubCard');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const tokenGet=()=>{try{return localStorage.getItem('clahe-gh-token')||'';}catch(e){return '';}};
const tokenSet=t=>{try{ if(t)localStorage.setItem('clahe-gh-token',t); else localStorage.removeItem('clahe-gh-token'); }catch(e){}};
const pubList=()=>{try{const l=JSON.parse(localStorage.getItem('clahe-publicadas')||'[]');return Array.isArray(l)?l:[];}catch(e){return [];}};
function pubRemember(it){const l=pubList().filter(x=>x.url!==it.url);l.unshift(it);try{localStorage.setItem('clahe-publicadas',JSON.stringify(l.slice(0,30)));}catch(e){}}

const ghApi=path=>'https://api.github.com/repos/'+PUB.owner+'/'+PUB.repo+'/contents/'+path;
const ghHeaders=t=>({'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json'});
async function ghError(r){let m='';try{m=(await r.json()).message||'';}catch(e){}const e=new Error(m||('HTTP '+r.status));e.status=r.status;return e;}
async function ghSha(token,path){
  const r=await fetch(ghApi(path)+'?ref='+PUB.branch,{headers:ghHeaders(token),cache:'no-store'});
  if(r.status===404)return null;
  if(!r.ok)throw await ghError(r);
  return (await r.json()).sha||null;
}
async function ghPut(token,path,b64,sha,message){
  const body={message,content:b64,branch:PUB.branch}; if(sha)body.sha=sha;
  const r=await fetch(ghApi(path),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghHeaders(token)),body:JSON.stringify(body)});
  if(!r.ok)throw await ghError(r);
  return r.json();
}
/* base64 del HTML en UTF-8 (btoa solo acepta latin1 y se ahoga con textos largos) */
const toB64=str=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]||'');fr.onerror=()=>rej(fr.error);fr.readAsDataURL(new Blob([str],{type:'text/html'}));});
function pubMensaje(e){
  const s=e&&e.status, m=e&&e.message?' ('+e.message+')':'';
  if(s===401)return 'GitHub rechazó la clave. Revisá que esté bien copiada o generá una nueva.';
  if(s===403)return 'La clave no tiene permiso para escribir en el repositorio: tiene que tener "Contents: Read and write".'+m;
  if(s===404)return 'GitHub no encuentra el repositorio con esta clave. Al crearla hay que darle acceso a '+PUB.repo+'.';
  if(!s)return 'No se pudo hablar con GitHub. Revisá la conexión y probá de nuevo.';
  return 'GitHub respondió con un error'+m+'.';
}

let pubGen=0;
const $p=id=>pubCard.querySelector('#'+id);
function pubShow(html){pubCard.innerHTML=html;}
function pubOpen(){pubEl.hidden=false;if(!PUB.owner)pubSinSitio();else if(tokenGet())pubStart();else pubConfig();}
function pubSinSitio(){
  pubShow('<h2 id="pubTitle">Publicar con un link</h2>'+
    '<p>Publicar funciona desde el editor abierto en su dirección de internet (GitHub Pages), no desde un archivo guardado en la computadora. Abrilo desde el sitio y volvé a intentar.</p>'+
    '<div class="rowb"><button class="btn" id="pubCancel">Cerrar</button></div>');
  $p('pubCancel').onclick=pubClose;
}
function pubClose(){pubEl.hidden=true;}
pubEl.addEventListener('click',e=>{if(e.target===pubEl)pubClose();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!pubEl.hidden)pubClose();});

function pubConfig(){
  pubShow('<h2 id="pubTitle">Publicar con un link</h2>'+
    '<p>Para publicar hace falta una clave de GitHub. Queda guardada solo en este dispositivo y se pide una sola vez.</p>'+
    '<ol><li>Entrá a <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a>.</li>'+
    '<li>Si el repositorio está en una organización, en <b>Resource owner</b> elegí la organización.</li>'+
    '<li>En <b>Repository access</b> elegí <i>Only select repositories</i> y marcá <b>'+PUB.repo+'</b>.</li>'+
    '<li>En <b>Permissions › Repository permissions</b> poné <b>Contents: Read and write</b>. Generá la clave y pegala acá.</li></ol>'+
    '<div class="field"><label for="pubTok">Clave de GitHub</label><input type="password" id="pubTok" placeholder="github_pat_…" autocomplete="off" autocapitalize="off" spellcheck="false"></div>'+
    '<div class="rowb"><button class="btn primary" id="pubTokOk">Guardar y seguir</button><button class="btn" id="pubCancel">Cancelar</button></div>');
  $p('pubTokOk').onclick=()=>{const t=$p('pubTok').value.trim();if(!t){toast('Pegá la clave primero');return;}tokenSet(t);pubStart();};
  $p('pubTok').onkeydown=e=>{if(e.key==='Enter')$p('pubTokOk').click();};
  $p('pubCancel').onclick=pubClose;
}

function pubStart(){
  const hist=pubList();
  pubShow('<h2 id="pubTitle">Publicar con un link</h2>'+
    '<p>La invitación de <b id="pubQuien"></b> va a quedar en un link para mandar por WhatsApp. Si ya hay una publicada con el mismo nombre, se reemplaza.</p>'+
    '<div class="field"><label for="pubSlug">Nombre del link</label><input type="text" id="pubSlug" autocomplete="off" autocapitalize="off" spellcheck="false"></div>'+
    '<p class="hint">Queda en <span id="pubPrev"></span></p>'+
    '<div class="rowb"><button class="btn primary" id="pubGo">Publicar ahora</button><button class="btn" id="pubCancel">Cancelar</button><button class="btn sm" id="pubTokChange">Cambiar clave</button></div>'+
    (hist.length?'<div class="list"><div class="lt">Publicadas desde este dispositivo</div><div id="pubHist"></div></div>':''));
  $p('pubQuien').textContent=state.celebrant||'este evento';
  const inp=$p('pubSlug'), prev=$p('pubPrev');
  inp.value=slug(state.celebrant);
  const upd=()=>{prev.textContent=PUB.base+PUB.dir+'/'+(slug(inp.value)||'…')+'/';};
  inp.oninput=upd; upd();
  $p('pubGo').onclick=()=>{const n=slug(inp.value);if(!n){toast('Escribí un nombre para el link');return;}pubRun(n);};
  $p('pubCancel').onclick=pubClose;
  $p('pubTokChange').onclick=pubConfig;
  if(hist.length){const h=$p('pubHist');hist.forEach(it=>{
    const row=document.createElement('div');row.className='it';
    const a=document.createElement('a');a.href=it.url;a.target='_blank';a.rel='noopener';a.textContent=(it.name||it.slug)+' · '+it.url.replace(PUB.base,'');
    const b=document.createElement('button');b.type='button';b.className='btn sm';b.textContent='Compartir';b.onclick=()=>pubShare(it.url,it.name);
    row.append(a,b);h.appendChild(row);});}
}

function pubBusy(msg,url){
  pubShow('<h2 id="pubTitle">Publicando…</h2><div class="prog"><span class="spin"></span><span id="pubMsg"></span></div>'+
    (url?'<div class="linkbox"><input type="text" id="pubUrl" readonly></div><p class="hint">Cuando se active vas a poder compartirlo desde acá. Podés cerrar esta ventana: te avisamos igual.</p>':'')+
    '<div class="rowb"><button class="btn" id="pubCancel">Cerrar</button></div>');
  $p('pubMsg').textContent=msg; if(url)$p('pubUrl').value=url;
  $p('pubCancel').onclick=pubClose;
}

function pubDone(url,lento){
  pubShow('<h2 id="pubTitle">'+(lento?'Casi listo':'¡Link listo!')+'</h2>'+
    '<p>'+(lento?'GitHub está tardando más de lo normal en activar el link. Suele funcionar en unos minutos: probalo antes de mandarlo.':'La invitación ya está publicada. Mandá este link por WhatsApp:')+'</p>'+
    '<div class="linkbox"><input type="text" id="pubUrl" readonly><button class="btn sm" id="pubCopy">Copiar</button></div>'+
    '<div class="rowb"><button class="btn primary wa" id="pubWa">Compartir por WhatsApp</button><a class="btn" id="pubOpen" target="_blank" rel="noopener">Abrir</a><button class="btn" id="pubCancel">Cerrar</button></div>'+
    '<p class="hint">Si cambiás algo, volvé a publicar con el mismo nombre y el link se actualiza solo.</p>');
  $p('pubUrl').value=url; $p('pubOpen').href=url;
  $p('pubUrl').onclick=()=>$p('pubUrl').select();
  $p('pubCopy').onclick=()=>pubCopy(url);
  $p('pubWa').onclick=()=>pubShare(url,state.celebrant);
  $p('pubCancel').onclick=pubClose;
}

function pubError(e,nombre){
  pubShow('<h2 id="pubTitle">No se pudo publicar</h2><p class="err" id="pubErr"></p>'+
    '<div class="rowb"><button class="btn primary" id="pubRetry">Probar de nuevo</button><button class="btn" id="pubTokChange">Cambiar clave</button><button class="btn" id="pubCancel">Cerrar</button></div>');
  $p('pubErr').textContent=pubMensaje(e);
  $p('pubRetry').onclick=()=>pubRun(nombre);
  $p('pubTokChange').onclick=pubConfig;
  $p('pubCancel').onclick=pubClose;
}

async function pubCopy(url){
  try{await navigator.clipboard.writeText(url);toast('Link copiado ✓');return;}catch(e){}
  const i=$p('pubUrl'); if(i){i.select();try{if(document.execCommand('copy')){toast('Link copiado ✓');return;}}catch(e){}}
  toast('No se pudo copiar: mantené apretado el link para copiarlo.');
}
function pubShare(url,nombre){
  const texto='Invitación'+(nombre?' de '+nombre:'')+' · Clahe Eventos';
  if(navigator.share){navigator.share({title:texto,text:texto,url}).catch(()=>{});return;}
  window.open('https://wa.me/?text='+encodeURIComponent(texto+'\n'+url),'_blank','noopener');
}

async function pubRun(nombre){
  const token=tokenGet(); if(!token){pubConfig();return;}
  const gen=++pubGen;
  const path=PUB.dir+'/'+nombre+'/index.html';
  const url=PUB.base+PUB.dir+'/'+nombre+'/';
  const id='p'+Date.now().toString(36);   // marca para saber cuándo Pages ya sirve esta versión
  const html=buildHTML(false,{url,pubId:id});
  pubBusy('Subiendo la invitación a GitHub…');
  try{
    let sha=await ghSha(token,path);
    if(sha && !pubList().some(x=>x.slug===nombre) && !confirm('Ya hay una invitación publicada como "'+nombre+'" desde otro dispositivo. ¿Reemplazarla?')){pubStart();return;}
    const b64=await toB64(html);
    const msg=(sha?'Actualiza':'Publica')+' invitación: '+nombre;
    try{ await ghPut(token,path,b64,sha,msg); }
    catch(e){
      if(e.status!==409&&e.status!==422)throw e;   // el archivo cambió mientras tanto: reintento con el sha nuevo
      sha=await ghSha(token,path); await ghPut(token,path,b64,sha,msg);
    }
  }catch(e){ if(gen===pubGen)pubError(e,nombre); return; }
  pubRemember({slug:nombre,name:state.celebrant,url,when:Date.now()});
  if(gen===pubGen)pubBusy('Subida. GitHub está activando el link, suele tardar un minuto…',url);
  /* Pages tarda un rato en publicar. Pido la página con un parámetro distinto
     cada vez (así no me responde la copia vieja del CDN) hasta ver la marca. */
  const t0=Date.now(); let activo=false;
  while(Date.now()-t0<4*60*1000){
    await sleep(5000);
    if(gen!==pubGen)return;
    try{const r=await fetch(url+'?v='+Date.now(),{cache:'no-store'}); if(r.ok&&(await r.text()).includes(id)){activo=true;break;}}catch(e){}
  }
  if(gen!==pubGen)return;
  toast(activo?'¡Link activo! ✓':'El link todavía se está activando');
  pubEl.hidden=false; pubDone(url,!activo);
}
document.getElementById('publish').onclick=pubOpen;
/* En el celular la botonera de arriba queda lejos una vez que scrolleaste. */
document.getElementById('fab').onclick=pubOpen;

/* init */
buildForm();render();
if(IS_SMALL){ const b=document.querySelector('.dev[data-d="phone"]'); if(b)b.click(); }
</script>
